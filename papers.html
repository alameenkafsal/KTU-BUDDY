<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTU Buddy | Previous Question Papers</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #100b20;
    color: white;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 30px;
    background: #1c1433;
    border: 1px solid #7138d8;
    border-radius: 18px;
}

h1 {
    color: #c5a5ff;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #bbb;
    margin-bottom: 25px;
}

.back {
    display: inline-block;
    color: #c5a5ff;
    text-decoration: none;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 15px 0 8px;
    color: #d8c7ff;
}

select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    background: #100b20;
    color: white;
    border: 1px solid #6943a8;
}

button {
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    background: #853cff;
    color: white;
    cursor: pointer;
    margin-top: 20px;
    font-weight: bold;
}

button:hover {
    background: #a46aff;
}

.paper-card {
    background: #302052;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #6943a8;
    margin-top: 20px;
}

.paper-card h3 {
    color: #c5a5ff;
    margin-bottom: 10px;
}

.paper-card p {
    color: #ddd;
    line-height: 1.6;
}

.paper-card a {
    display: inline-block;
    background: #853cff;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 7px;
    margin-top: 12px;
}

.paper-card a:hover {
    background: #a46aff;
}

.info {
    text-align: center;
    color: #aaa;
    margin-top: 25px;
    line-height: 1.6;
}

</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Back to Dashboard</a>

<h1>📝 Previous Question Papers</h1>

<p class="subtitle">
KTU Buddy - Previous Year Question Paper Library
</p>

<label>Choose Scheme</label>
<select id="scheme">
<option value="2024">2024 Scheme</option>
<option value="2019">2019 Scheme</option>
</select>

<label>Choose Branch</label>
<select id="branch">
<option value="CSE">Computer Science Engineering</option>
<option value="AIML">Artificial Intelligence & Machine Learning</option>
<option value="CSBS">Computer Science and Business Systems</option>
<option value="ECE">Electronics and Communication</option>
<option value="EEE">Electrical and Electronics</option>
<option value="ME">Mechanical Engineering</option>
<option value="CE">Civil Engineering</option>
<option value="IT">Information Technology</option>
<option value="Other">Other</option>
</select>

<label>Choose Semester</label>
<select id="semester">
<option value="S1">Semester 1</option>
<option value="S2">Semester 2</option>
<option value="S3">Semester 3</option>
<option value="S4">Semester 4</option>
<option value="S5">Semester 5</option>
<option value="S6">Semester 6</option>
<option value="S7">Semester 7</option>
<option value="S8">Semester 8</option>
</select>

<button onclick="searchPapers()">Find Question Papers</button>

<div id="results">

<div class="paper-card">
<h3>📚 Welcome to KTU Buddy</h3>
<p>Select your scheme, branch and semester to find question papers.</p>
</div>

</div>

<p class="info">
Question paper links will be added after verification.
Always check the correct subject code and scheme.
</p>

</div>

<script>

function searchPapers() {

    const scheme = document.getElementById("scheme").value;
    const branch = document.getElementById("branch").value;
    const semester = document.getElementById("semester").value;

    document.getElementById("results").innerHTML = `

        <div class="paper-card">

            <h3>📄 Selected Question Paper Details</h3>

            <p><b>Scheme:</b> ${scheme}</p>
            <p><b>Branch:</b> ${branch}</p>
            <p><b>Semester:</b> ${semester}</p>

        </div>

        <div class="paper-card">

            <h3>📝 Previous Year Question Papers</h3>

            <p>Question papers for your selection will be uploaded here.</p>

            <p style="color:#ffcc80;margin-top:10px;">
            No verified PDF uploaded yet.
            </p>

        </div>

        <div class="paper-card">

            <h3>🌐 Official KTU Website</h3>

            <p>Visit KTU official website for university updates and resources.</p>

            <a href="https://ktu.edu.in/" target="_blank">
            Visit KTU
            </a>

        </div>

    `;
}

</script>

</body>
</html>
